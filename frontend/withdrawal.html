<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Withdrawal | Mirror Trading</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #07111f;
    color: white;
    min-height: 100vh;
    padding: 30px 20px;
}

.container {
    max-width: 650px;
    margin: auto;
}

.card {
    background: #0d1b2d;
    border: 1px solid #1e334d;
    border-radius: 16px;
    padding: 30px;
}

.logo {
    font-size: 25px;
    font-weight: bold;
    margin-bottom: 30px;
}

.logo span {
    color: #22c55e;
}

h1 {
    margin-bottom: 10px;
}

.description {
    color: #94a3b8;
    margin-bottom: 25px;
    line-height: 1.6;
}

.balance {
    background: #13243a;
    padding: 18px;
    border-radius: 10px;
    margin-bottom: 25px;
}

.balance-label {
    color: #94a3b8;
    font-size: 13px;
    margin-bottom: 7px;
}

.balance-amount {
    font-size: 28px;
    font-weight: bold;
    color: #22c55e;
}

.form-group {
    margin-bottom: 20px;
}

label {
    display: block;
    margin-bottom: 8px;
    color: #cbd5e1;
}

input,
select {
    width: 100%;
    padding: 14px;
    border-radius: 8px;
    border: 1px solid #334155;
    background: #07111f;
    color: white;
    font-size: 15px;
}

input:focus,
select:focus {
    outline: none;
    border-color: #22c55e;
}

.warning {
    background: #13243a;
    color: #94a3b8;
    padding: 15px;
    border-radius: 8px;
    margin-bottom: 20px;
    line-height: 1.5;
    font-size: 13px;
}

button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 8px;
    background: #22c55e;
    color: #04100a;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #16a34a;
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.message {
    margin-top: 18px;
    padding: 13px;
    border-radius: 8px;
    display: none;
}

.success {
    display: block;
    background: rgba(34,197,94,.12);
    color: #4ade80;
}

.error {
    display: block;
    background: rgba(239,68,68,.12);
    color: #fca5a5;
}

.back {
    display: inline-block;
    margin-top: 20px;
    color: #22c55e;
    text-decoration: none;
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<div class="logo">
Mirror<span>Trading</span>
</div>

<h1>Withdraw Funds</h1>

<p class="description">
Request a withdrawal from your Mirror Trading account.
</p>


<div class="balance">

<div class="balance-label">
Available Balance
</div>

<div class="balance-amount" id="balance">
Loading...
</div>

</div>


<form id="withdrawalForm">

<div class="form-group">

<label for="amount">
Withdrawal Amount
</label>

<input
    type="number"
    id="amount"
    min="1"
    step="0.01"
    placeholder="Enter amount"
    required
>

</div>


<div class="warning">

For this demo application, withdrawals are processed
through the Mirror Trading backend.

</div>


<button type="submit" id="withdrawButton">
Submit Withdrawal
</button>

<div id="message" class="message"></div>

</form>


<a class="back" href="dashboard.html">
â† Back to Dashboard
</a>

</div>

</div>


<script>

const API_URL = "https://mirror-trading.onrender.com";

const token = localStorage.getItem("token");


// ------------------------------------------
// CHECK LOGIN
// ------------------------------------------

if (!token) {

    window.location.href = "login.html";

}


// ------------------------------------------
// LOAD BALANCE
// ------------------------------------------

async function loadBalance() {

    try {

        const response = await fetch(
            `${API_URL}/api/dashboard`,
            {
                method: "GET",

                headers: {
                    "Authorization": `Bearer ${token}`
                }
            }
        );


        const data = await response.json();


        if (!response.ok) {

            throw new Error(
                data.message || "Unable to load account"
            );

        }


        document.getElementById("balance").textContent =
            "$" + Number(data.balance).toFixed(2);


    } catch (error) {

        console.error(error);

        document.getElementById("balance").textContent =
            "Unable to load";

    }

}


// ------------------------------------------
// WITHDRAW
// ------------------------------------------

document
.getElementById("withdrawalForm")
.addEventListener("submit", async function(event) {

    event.preventDefault();


    const amount =
        Number(document.getElementById("amount").value);


    const message =
        document.getElementById("message");


    const button =
        document.getElementById("withdrawButton");


    message.className = "message";
    message.textContent = "";


    if (!amount || amount <= 0) {

        message.className = "message error";
        message.textContent =
            "Enter a valid withdrawal amount.";

        return;

    }


    button.disabled = true;
    button.textContent = "Processing...";


    try {

        const response = await fetch(
            `${API_URL}/api/wallet/withdraw`,
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${token}`
                },

                body: JSON.stringify({
                    amount: amount
                })
            }
        );


        const data = await response.json();


        if (!response.ok) {

            throw new Error(
                data.message || "Withdrawal failed"
            );

        }


        message.className =
            "message success";

        message.textContent =
            `Withdrawal successful. New balance: $${Number(data.balance).toFixed(2)}`;


        document.getElementById("balance").textContent =
            "$" + Number(data.balance).toFixed(2);


        document.getElementById("amount").value = "";


    } catch (error) {

        console.error("Withdrawal error:", error);


        message.className =
            "message error";

        message.textContent =
            error.message;

    }


    button.disabled = false;

    button.textContent =
        "Submit Withdrawal";

});


// ------------------------------------------
// START
// ------------------------------------------

loadBalance();

</script>

</body>
</html>
