title>Create Account | Mirror Trading</title>

<style>
* {
box-sizing: border-box;
margin: 0;
padding: 0;
}

body {
font-family: Arial, sans-serif;
min-height: 100vh;
display: flex;
justify-content: center;
align-items: center;
background: #07111f;
color: white;
padding: 20px;
}

.container {
width: 100%;
max-width: 450px;
background: #0d1b2d;
border: 1px solid #1e334d;
border-radius: 18px;
padding: 35px;
box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
}

.logo {
text-align: center;
font-size: 28px;
font-weight: bold;
margin-bottom: 10px;
}

.logo span {
color: #22c55e;
}

.subtitle {
text-align: center;
color: #94a3b8;
margin-bottom: 30px;
}

.form-group {
margin-bottom: 18px;
}

label {
display: block;
margin-bottom: 8px;
color: #cbd5e1;
font-size: 14px;
}

input {
width: 100%;
padding: 14px;
border-radius: 8px;
border: 1px solid #334155;
background: #07111f;
color: white;
outline: none;
font-size: 15px;
}

input:focus {
border-color: #22c55e;
}

.terms {
display: flex;
gap: 10px;
align-items: flex-start;
margin: 20px 0;
color: #94a3b8;
font-size: 13px;
line-height: 1.5;
}

.terms input {
width: auto;
margin-top: 3px;
}

button {
width: 100%;
padding: 15px;
border: none;
border-radius: 8px;
background: #22c55e;
color: #04100a;
font-weight: bold;
font-size: 16px;
cursor: pointer;
}

button:hover {
background: #16a34a;
}

.login {
text-align: center;
margin-top: 22px;
color: #94a3b8;
}

.login a {
color: #22c55e;
text-decoration: none;
font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

<div class="logo">
Mirror<span>Trading</span>
</div>

<p class="subtitle">
Create your account
</p>

<form id="registerForm">

<div class="form-group">
<label for="name">Full Name</label>
<input
type="text"
id="name"
placeholder="Enter your full name"
required
>
</div>

<div class="form-group">
<label for="email">Email Address</label>
<input
type="email"
id="email"
placeholder="Enter your email"
required
>
</div>

<div class="form-group">
<label for="password">Password</label>
<input
type="password"
id="password"
placeholder="Create a password"
minlength="8"
required
>
</div>

<div class="form-group">
<label for="confirmPassword">Confirm Password</label>
<input
type="password"
id="confirmPassword"
placeholder="Confirm your password"
minlength="8"
required
>
</div>

<label class="terms">
<input type="checkbox" id="terms" required>
<span>
I agree to the Mirror Trading terms and conditions.
</span>
</label>

<button type="submit">
Create Account
</button>

</form>

<div class="login">
Already have an account?
<a href="login.html">Log in</a>
</div>

</div>

<script>
document.getElementById("registerForm").addEventListener("submit", function(event) {
event.preventDefault();

const password = document.getElementById("password").value;
const confirmPassword = document.getElementById("confirmPassword").value;

if (password !== confirmPassword) {
alert("Passwords do not match.");
return;
}

alert("Registration page is ready. We will connect it to the backend next.");
});
</script>

</body>
</html>
