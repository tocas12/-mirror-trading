<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Account | Mirror Trading</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #07111f;
  color: white;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 450px;
  background: #0d1b2d;
  border: 1px solid #1e334d;
  border-radius: 18px;
  padding: 35px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
}

.logo {
  text-align: center;
  font-size: 28px;
  font-weight: bold;
  margin-bottom: 10px;
}

.logo span {
  color: #22c55e;
}

.subtitle {
  text-align: center;
  color: #94a3b8;
  margin-bottom: 30px;
}

.form-group {
  margin-bottom: 18px;
}

label {
  display: block;
  margin-bottom: 8px;
  color: #cbd5e1;
  font-size: 14px;
}

input {
  width: 100%;
  padding: 14px;
  border-radius: 8px;
  border: 1px solid #334155;
  background: #07111f;
  color: white;
  outline: none;
  font-size: 15px;
}

input:focus {
  border-color: #22c55e;
}

.terms {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  margin: 20px 0;
  color: #94a3b8;
  font-size: 13px;
  line-height: 1.5;
}

.terms input {
  width: auto;
  margin-top: 3px;
}

button {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 8px;
  background: #22c55e;
  color: #04100a;
  font-weight: bold;
  font-size: 16px;
  cursor: pointer;
}

button:hover {
  background: #16a34a;
}

button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.login {
  text-align: center;
  margin-top: 22px;
  color: #94a3b8;
}

.login a {
  color: #22c55e;
  text-decoration: none;
  font-weight: bold;
}

.message {
  display: none;
  padding: 12px;
  border-radius: 8px;
  margin-bottom: 18px;
  font-size: 14px;
  line-height: 1.4;
}

.message.error {
  display: block;
  background: rgba(239, 68, 68, 0.15);
  border: 1px solid #ef4444;
  color: #fca5a5;
}

.message.success {
  display: block;
  background: rgba(34, 197, 94, 0.15);
  border: 1px solid #22c55e;
  color: #86efac;
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">
    Mirror<span>Trading</span>
  </div>

  <p class="subtitle">
    Create your account
  </p>

  <div id="message" class="message"></div>

  <form id="registerForm">

    <div class="form-group">
      <label for="name">Full Name</label>

      <input
        type="text"
        id="name"
        placeholder="Enter your full name"
        required
      >
    </div>

    <div class="form-group">
      <label for="email">Email Address</label>

      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >
    </div>

    <div class="form-group">
      <label for="password">Password</label>

      <input
        type="password"
        id="password"
        placeholder="Create a password"
        minlength="8"
        required
      >
    </div>

    <div class="form-group">
      <label for="confirmPassword">Confirm Password</label>

      <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm your password"
        minlength="8"
        required
      >
    </div>

    <label class="terms">
      <input type="checkbox" id="terms" required>

      <span>
        I agree to the Mirror Trading terms and conditions.
      </span>
    </label>

    <button type="submit" id="registerButton">
      Create Account
    </button>

  </form>

  <div class="login">
    Already have an account?
    <a href="login.html">Log in</a>
  </div>

</div>


<script>

const API_URL = "https://mirror-trading.onrender.com";

const registerForm =
  document.getElementById("registerForm");

const registerButton =
  document.getElementById("registerButton");

const message =
  document.getElementById("message");


function showMessage(text, type) {

  message.textContent = text;

  message.className =
    "message " + type;
}


registerForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    const name =
      document.getElementById("name")
        .value
        .trim();

    const email =
      document.getElementById("email")
        .value
        .trim();

    const password =
      document.getElementById("password")
        .value;

    const confirmPassword =
      document.getElementById("confirmPassword")
        .value;


    if (password !== confirmPassword) {

      showMessage(
        "Passwords do not match.",
        "error"
      );

      return;
    }


    if (password.length < 8) {

      showMessage(
        "Password must be at least 8 characters.",
        "error"
      );

      return;
    }


    registerButton.disabled = true;

    registerButton.textContent =
      "Creating Account...";

    message.className = "message";

    message.textContent = "";


    try {

      const response =
        await fetch(
          `${API_URL}/api/auth/register`,
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({
              name,
              email,
              password
            })
          }
        );


      const data =
        await response.json();


      if (!response.ok) {

        throw new Error(
          data.message ||
          "Registration failed"
        );
      }


      // Save the newly-created login session
      localStorage.setItem(
        "token",
        data.token
      );

      localStorage.setItem(
        "user",
        JSON.stringify(data.user)
      );


      showMessage(
        "Account created successfully. Redirecting...",
        "success"
      );


      setTimeout(function() {

        window.location.href =
          "dashboard.html";

      }, 1000);


    } catch (error) {

      console.error(
        "REGISTRATION ERROR:",
        error
      );


      showMessage(
        error.message,
        "error"
      );


      registerButton.disabled = false;

      registerButton.textContent =
        "Create Account";
    }

  }
);

</script>

</body>
</html>
