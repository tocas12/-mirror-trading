<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Deposit | Mirror Trading</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #07111f;

.container {

input {

</style>
</head>

<body>

<div class="container">

<div class="card">

<div class="logo">
Mirror<span>Trading</span>
</div>

<h1>Deposit</h1>

<p class="description">
Choose a cryptocurrency and send your deposit to the wallet address shown below.
</p>

<div class="notice">
Your deposit will be reviewed before funds are added to your account balance.
</div>

<form id="depositForm">

<label for="asset">
Asset
</label>

<select id="asset" required>

<option value="">
Select asset
</option>

<option value="BTC">
Bitcoin (BTC)
</option>

<option value="USDT_TRC20">
USDT (TRC20)
</option>

<option value="USDT_ERC20">
USDT (ERC20)
</option>

<option value="USDT_BEP20">
USDT (BEP20)
</option>

</select>


<div id="walletBox" class="wallet-box">

<div class="wallet-title">
Deposit wallet address
</div>

<div id="walletAddress" class="wallet-address">
Loading...
</div>

<button
    type="button"
    class="copy-button"
    id="copyButton">
    Copy Address
</button>

</div>


<label for="amount">
Amount
</label>

<input
    type="number"
    id="amount"
    min="1"
    step="0.01"
    placeholder="Enter amount"
    required
>


<button type="submit" id="depositButton">
I Have Sent The Deposit
</button>

<div id="message" class="message"></div>

</form>


<a class="back" href="dashboard.html">
← Back to Dashboard
</a>

</div>

</div>


<script>

const API_URL = "https://mirror-trading.onrender.com";

const token = localStorage.getItem("token");

let wallets = {};


// ======================================================
// CHECK LOGIN
// ======================================================

if (!token) {
    window.location.href = "login.html";
}


// ======================================================
// LOAD DEPOSIT WALLETS
// ======================================================

async function loadWallets() {

    try {

        const response = await fetch(
            API_URL + "/api/transactions/deposit-wallets",
            {
                headers: {
                    "Authorization": "Bearer " + token
                }
            }
        );

        const data = await response.json();

        if (response.status === 401) {

            localStorage.removeItem("token");
            window.location.href = "login.html";
            return;

        }

        if (!response.ok) {
            throw new Error(
                data.message || "Unable to load deposit wallets"
            );
        }

        wallets = data.wallets || {};

    } catch (error) {

        console.error(
            "WALLET LOAD ERROR:",
            error
        );

        showMessage(
            error.message,
            "error"
        );
    }
}


// ======================================================
// SHOW SELECTED WALLET
// ======================================================

document
.getElementById("asset")
.addEventListener("change", function() {

    const asset = this.value;

    const walletBox =
        document.getElementById("walletBox");

    const walletAddress =
        document.getElementById("walletAddress");

    if (!asset) {

        walletBox.style.display = "none";
        return;

    }

    const address = wallets[asset];

    if (!address) {

        walletAddress.textContent =
            "Deposit address is not configured yet.";

        walletBox.style.display = "block";

        return;
    }

    walletAddress.textContent = address;

    walletBox.style.display = "block";

});


// ======================================================
// COPY WALLET ADDRESS
// ======================================================

document
.getElementById("copyButton")
.addEventListener("click", async function() {

    const address =
        document.getElementById("walletAddress").textContent;

    if (!address || address.includes("not configured")) {
        return;
    }

    try {

        await navigator.clipboard.writeText(address);

        this.textContent = "Copied!";

        setTimeout(() => {
            this.textContent = "Copy Address";
        }, 1500);

    } catch (error) {

        alert("Unable to copy address. Please copy it manually.");

    }

});


// ======================================================
// DEPOSIT SUBMISSION
// ======================================================

document
.getElementById("depositForm")
.addEventListener("submit", function(event) {

    event.preventDefault();

    const asset =
        document.getElementById("asset").value;

    const amount =
        Number(document.getElementById("amount").value);

    if (!asset) {

        showMessage(
            "Please select a cryptocurrency.",
            "error"
        );

        return;
    }

    if (!Number.isFinite(amount) || amount <= 0) {

        showMessage(
            "Please enter a valid deposit amount.",
            "error"
        );

        return;
    }

    const address = wallets[asset];

    if (!address) {

        showMessage(
            "A deposit wallet has not been configured for this asset yet.",
            "error"
        );

        return;
    }

    showMessage(
        "Deposit instructions displayed. Send the funds to the wallet address above. Your deposit must be verified before your account balance is updated.",
        "success"
    );

});


// ======================================================
// MESSAGE
// ======================================================

function showMessage(text, type) {

    const message =
        document.getElementById("message");

    message.style.display = "block";

    if (type === "success") {

        message.style.background =
            "rgba(34,197,94,.12)";

        message.style.color =
            "#4ade80";

    } else {

        message.style.background =
            "rgba(239,68,68,.12)";

        message.style.color =
            "#fca5a5";
    }

    message.textContent = text;
}


// ======================================================
// START
// ======================================================

loadWallets();

</script>

</body>
</html>
