<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Deposit | Mirror Trading</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #07111f;
    color: white;
    min-height: 100vh;
}

.container {
    width: 100%;
    max-width: 650px;
    margin: 60px auto;
    padding: 20px;
}

.card {
    background: #0d1b2d;
    border: 1px solid #1e334d;
    border-radius: 16px;
    padding: 30px;
}

.logo {
    font-size: 25px;
    font-weight: bold;
    margin-bottom: 30px;
}

.logo span {
    color: #22c55e;
}

h1 {
    margin-bottom: 10px;
}

.description {
    color: #94a3b8;
    line-height: 1.6;
    margin-bottom: 30px;
}

label {
    display: block;
    margin-bottom: 8px;
    color: #cbd5e1;
}

select,
input {
    width: 100%;
    padding: 14px;
    margin-bottom: 20px;
    border-radius: 8px;
    border: 1px solid #334155;
    background: #07111f;
    color: white;
    font-size: 15px;
}

button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 8px;
    background: #22c55e;
    color: #04100a;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #16a34a;
}

.message {
    margin-top: 20px;
    padding: 15px;
    border-radius: 8px;
    display: none;
}

.back {
    display: inline-block;
    margin-top: 20px;
    color: #22c55e;
    text-decoration: none;
}

</style>
</head>

<body>

<div class="container">

<div class="card">

<div class="logo">
Mirror<span>Trading</span>
</div>

<h1>Deposit</h1>

<p class="description">
Add funds to your Mirror Trading account.
</p>

<form id="depositForm">

<label for="asset">
Asset
</label>

<select id="asset" required>

<option value="">
Select asset
</option>

<option value="btc">
Bitcoin (BTC)
</option>

<option value="eth">
Ethereum (ETH)
</option>

<option value="usdt">
Tether (USDT)
</option>

<option value="usdc">
USD Coin (USDC)
</option>

</select>


<label for="amount">
Amount
</label>

<input
    type="number"
    id="amount"
    min="1"
    step="0.01"
    placeholder="Enter amount"
    required
>


<button type="submit" id="depositButton">
Continue
</button>

<div id="message" class="message"></div>

</form>


<a class="back" href="dashboard.html">
â† Back to Dashboard
</a>

</div>

</div>


<script>

const API_URL = "https://mirror-trading.onrender.com";

const token = localStorage.getItem("token");


// Check login

if (!token) {

    window.location.href = "login.html";

}


// Deposit

document
.getElementById("depositForm")
.addEventListener("submit", async function(event) {

    event.preventDefault();


    const asset =
        document.getElementById("asset").value;

    const amount =
        Number(document.getElementById("amount").value);

    const button =
        document.getElementById("depositButton");

    const message =
        document.getElementById("message");


    if (!asset || !amount || amount <= 0) {

        alert("Please select an asset and enter a valid amount.");

        return;

    }


    button.disabled = true;

    button.textContent = "Processing...";


    try {

        const response = await fetch(
            `${API_URL}/api/wallet/deposit`,
            {

                method: "POST",

                headers: {

                    "Content-Type": "application/json",

                    "Authorization":
                        `Bearer ${token}`

                },

                body: JSON.stringify({

                    amount: amount

                })

            }
        );


        const data =
            await response.json();


        console.log(
            "DEPOSIT RESPONSE:",
            data
        );


        if (response.status === 401) {

            localStorage.removeItem("token");

            window.location.href =
                "login.html";

            return;

        }


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Deposit failed"
            );

        }


        message.style.display = "block";

        message.style.background =
            "rgba(34,197,94,.12)";

        message.style.color =
            "#4ade80";

        message.textContent =
            "Deposit successful! New balance: $" +
            Number(data.balance).toFixed(2);


        document.getElementById("amount").value = "";


        setTimeout(function() {

            window.location.href =
                "dashboard.html";

        }, 1500);


    } catch (error) {

        console.error(
            "DEPOSIT ERROR:",
            error
        );


        message.style.display = "block";

        message.style.background =
            "rgba(239,68,68,.12)";

        message.style.color =
            "#fca5a5";

        message.textContent =
            error.message;

    }


    button.disabled = false;

    button.textContent = "Continue";

});

</script>

</body>
</html>
